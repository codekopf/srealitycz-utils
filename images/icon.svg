  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <path d="M56 22 L100 58 H88 V104 H24 V58 H12 Z" fill="#fff" stroke="#fff" stroke-width="6" stroke-linejoin="round"/>
  <rect x="46" y="76" width="20" height="31" rx="3" fill="#26304a"/>
